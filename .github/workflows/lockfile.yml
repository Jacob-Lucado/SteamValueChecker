# Press this when package-lock.json drifts from package.json (a clean `npm ci` fails with "Missing: ... from lock file").
# On GitHub: Actions, Refresh lockfile, Run workflow. It rebuilds the lockfile and commits it to the branch you pick.
name: Refresh lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit if it changed
        run: |
          if git diff --quiet package-lock.json; then echo "The lockfile was already in sync."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock.json"
          git push
