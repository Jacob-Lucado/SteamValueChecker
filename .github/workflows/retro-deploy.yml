# Deploys the hotel in retro/ to its own Fly app. The bot's app is never redeployed by this.
# On GitHub: Actions, Deploy hotel to Fly, Run workflow. It only runs when you press it.
# Uses the same FLY_API_TOKEN secret as the bot. It must be an organization token so it can make the hotel's app.
name: Deploy hotel to Fly
on:
  workflow_dispatch:
    inputs:
      move_domain:
        description: Move retro.steamvaluechecker.com off the bot's app and onto the hotel's app
        type: boolean
        default: true
concurrency: fly-deploy-hotel
env:
  APP: steamvaluechecker-retro
  BOT_APP: steamvaluechecker
  DOMAIN: retro.steamvaluechecker.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: retro
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Make the hotel's app the first time
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          if [ -z "$FLY_API_TOKEN" ]; then echo "Add the FLY_API_TOKEN secret first (repo Settings > Secrets and variables > Actions)."; exit 1; fi
          if flyctl status -a "$APP" > /dev/null 2>&1; then
            echo "$APP already exists."
          else
            flyctl apps create "$APP" --org personal || {
              echo "Couldn't make the $APP app. The FLY_API_TOKEN is probably a deploy token for the bot's app only."
              echo "In the Fly dashboard: Tokens, Create token, pick Organization token, then paste it into the FLY_API_TOKEN secret here."
              exit 1
            }
          fi
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Build from the newest CMS and game server commits. A cached build is only reused when neither changed.
          cms_sha=$(git ls-remote https://github.com/Jacob-Lucado/CMS.git refs/heads/main | cut -f1)
          emu_sha=$(git ls-remote https://github.com/Jacob-Lucado/EMU.git refs/heads/main | cut -f1)
          echo "CMS $cms_sha, game server $emu_sha"
          flyctl deploy --remote-only --app "$APP" --config fly.toml --wait-timeout 15m \
            --build-arg CMS_SHA="$cms_sha" --build-arg EMU_SHA="$emu_sha"
      - name: Point the domain at the hotel
        if: ${{ inputs.move_domain }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl certs show "$DOMAIN" -a "$BOT_APP" > /dev/null 2>&1; then
            flyctl certs remove "$DOMAIN" -a "$BOT_APP" --yes
          fi
          flyctl certs show "$DOMAIN" -a "$APP" > /dev/null 2>&1 || flyctl certs add "$DOMAIN" -a "$APP"
          echo
          echo "At Spaceship, point the CNAME record for retro at $APP.fly.dev. Fly finishes the certificate a few minutes after that."
          flyctl certs show "$DOMAIN" -a "$APP" || true
