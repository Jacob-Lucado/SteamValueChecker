[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/data/mysql --bind-address=127.0.0.1 --innodb-buffer-pool-size=256M
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 --nodaemonize --fpm-config /etc/php/8.5/fpm/php-fpm.conf
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:emulator]
command="/var/www/hotel/emulator/Plus Emulator"
directory=/var/www/hotel/emulator
user=plusemu
environment=HOME="/var/www/hotel/emulator",DOTNET_GCHeapHardLimit="0x30000000"
priority=30
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:camera]
command=/bin/sh -c "set -a; . /run/hotel-camera.env; exec node server.mjs"
directory=/var/www/hotel/emulator/CameraRenderer
user=plusemu
environment=HOME="/var/www/hotel/emulator"
priority=35
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/hotel/cms/artisan schedule:run --no-interaction > /dev/null 2>&1; sleep 60; done"
directory=/var/www/hotel/cms
user=www-data
priority=50
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true
