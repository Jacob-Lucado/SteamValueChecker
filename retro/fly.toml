# The hotel at retro.steamvaluechecker.com. Deployed with the "Deploy hotel to Fly" button under Actions.

app = 'steamvaluechecker-retro'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  SITE_URL = 'https://retro.steamvaluechecker.com'
  HOTEL_NAME = 'Lucado Hotel'

[[mounts]]
  source = 'hotel_data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Players stay connected to the game for hours, so one machine keeps every room together.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = '300s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'

[[restart]]
  policy = 'always'
