# fly.toml app configuration file generated for steamvaluechecker on 2026-10-26T08:06:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'steamvaluechecker'
primary_region = 'iad'

[build]

[env]
  BACKUP_DIR = '/data/backups'
  DASHBOARD_HOST = '0.0.0.0'
  DASHBOARD_PORT = '3000'
  DASHBOARD_TRUST_PROXY = '1'
  DATABASE_PATH = '/data/steamvaluechecker.db'

[[mounts]]
  source = 'svc_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Marks the machine unhealthy if the process or database stops answering. It doesn't depend on Discord, so a Discord outage can't take the dashboard down.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'

# A Discord bot must always be running: restart it whenever it stops, whatever the exit code.
[[restart]]
  policy = 'always'
