# Change `app` to your Fly app name (fly launch --no-deploy --copy-config will offer to do this).
app = "steam-value-checker"
primary_region = "iad"

[build]

[env]
  DATABASE_PATH = "/data/steamvaluechecker.db"
  BACKUP_DIR = "/data/backups"
  DASHBOARD_HOST = "0.0.0.0"
  DASHBOARD_PORT = "3000"
  DASHBOARD_TRUST_PROXY = "1"

[mounts]
  source = "svc_data"
  destination = "/data"

# The bot must stay running 24/7, so the machine never auto-stops.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
