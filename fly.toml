# fly.toml app configuration file generated for steamvaluechecker on 2026-10-26T19:44:46Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'steamvaluechecker'
primary_region = 'iad'

[build]

[env]
  BACKUP_DIR = '/data/backups'
  DASHBOARD_HOST = '0.0.0.0'
  DASHBOARD_PORT = '3000'
  DASHBOARD_TRUST_PROXY = '1'
  DATABASE_PATH = '/data/steamvaluechecker.db'

[[mounts]]
  source = 'svc_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[restart]]
  policy = 'always'
